name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install build123d matplotlib numpy markdown pytest
      - name: Light geometry tests
        run: python -m pytest -q tests
      - name: Generated files are up to date
        run: python tools/build_all.py --check
